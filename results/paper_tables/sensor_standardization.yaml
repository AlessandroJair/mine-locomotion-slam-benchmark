where_the_mounts_are_defined:
- 'Rocker-Bogie (unchanged, it sets the reference): origins of velodyne_base_mount_joint,
  camera_joint and imu_joint in rocker_bogie/urdf/ensamblajeurdf.xacro.'
- 'Husky: <pose> of velodyne_base_link, camera_link and imu_link in differential/model/model.sdf.'
- 'Tracked: origins of velodyne_base_mount_joint, camera_joint and imu_joint in tracked/gazebo_continuous_track_example/urdf_xacro/two_track_robot.urdf.xacro.'
- Each edited element carries a SENSOR STANDARDIZATION comment giving its native value
  and the arithmetic used.
- 'Re-run extract_sensor_poses.py after any change: the spread at the bottom of the
  table must stay ~0 for the control to hold.'
