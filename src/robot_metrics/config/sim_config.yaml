# =============================================================================
# sim_config.yaml - single source of truth for the simulation setup
# =============================================================================
# check_sim_parity.py asserts that what is written here is what is actually in
# the .world / URDF / SDF files, and that the three robot packages agree; run
# it before every campaign.  run_campaign.sh drives the experiment.
# =============================================================================

experiment:
  name: "mine_exploration_comparison"
  world: "lcmine.world"
  runs_per_robot: 3
  # Seconds discarded at the start of every log (Gazebo spawn / solver
  # transient).  Applied identically to all robots by analyze_metrics.py.
  warmup_s: 5.0

# -----------------------------------------------------------------------------
# REPRODUCIBILITY
# -----------------------------------------------------------------------------
# Run N is launched with `gzserver --seed (seed_base + N)` and the seed is
# written into its run_meta.yaml, so any run can be replayed.  Different seeds
# mean different sensor noise, which is what the reported std measures.
#
# What the seed covers, established by symbol inspection (nm -D): the IMU
# plugin calls ignition::math::Rand, which the seed controls; the Velodyne
# plugin calls the C library's rand(), which it does not.  All LiDAR noise
# therefore lives in the sensor's own <noise> block, and the plugin's
# <gaussianNoise> is zero.
reproducibility:
  seed_base: 0
  seed_rule: "gazebo_seed = seed_base + run_id"
  seeded_generators: ["ignition::math::Rand (Gazebo <noise> models)"]
  unseeded_generators: ["C rand() in libgazebo_ros_velodyne_gpu_laser.so - now
                         unused, its gaussianNoise is 0.0"]

# -----------------------------------------------------------------------------
# LIDAR.  100 m is the VLP-16 datasheet range, which is what goes in the sensor
# table; no ray in the gallery comes close to it.
#
# The two minima are not an inconsistency: the real driver
# (velodyne_pointcloud) reports nothing below ~0.9 m while the raw sensor sees
# from ~0.3, so the plugin cut models the driver and the <ray> min the sensor
# underneath it.
# -----------------------------------------------------------------------------
lidar:
  max_range_m: 100.0
  min_range_m: 0.9          # corte del plugin, imita al driver real
  ray_min_m: 0.3            # sensor crudo, debajo del filtro
  model: "Velodyne VLP-16"

# -----------------------------------------------------------------------------
# MONTAJE DE SENSORES - identico en las tres plataformas, para que la
# comparacion atribuya las diferencias de SLAM a la locomocion y no a donde
# esta puesto el sensor.  Ver README seccion 1.5.
#
# Alturas referidas al ORIGEN DE LOS RAYOS en el caso del LiDAR (el
# <sensor><pose> del Velodyne lo sube 0.0377 m sobre su link, 0.0641 en el
# rocker_bogie) y al link de montaje en los otros dos.  Las comprueba
# check_sim_parity.py (comprobacion 13) sobre el archivo que cada launch
# spawnea DE VERDAD, y contra la descripcion que alimenta TF.
# -----------------------------------------------------------------------------
sensor_mounting:
  # El LiDAR y la camara se igualan por ALTURA SOBRE EL SUELO, porque lo que
  # ven -cuanto suelo tapa el propio chasis, que trozo de pared encuadran-
  # depende de su altura.
  #
  # Lo ata el TRACKED: el suelo del anillo de -15 deg con 4.2 deg de margen
  # esta en 0.5481 (husky, ruedas), 0.6095 (tracked, arcos de oruga) y 0.6072
  # (rocker), medidos con scripts/lidar_occlusion.py sobre el modelo que
  # Gazebo carga.  0.6700 le deja 0.06 m al que menos margen tiene.
  #
  # LAS DOS BAJAN LO MISMO A PROPOSITO: la camara esta 0.1393 m por debajo del
  # LiDAR y 0.371 m por delante, y a esa distancia tapa el anillo bajo a
  # -18.50 deg.  Ese angulo NO depende de la altura mientras las dos bajen
  # juntas, asi que el margen de la camara se queda en 3.50 deg.
  lidar_height_above_contact_m: 0.6700
  camera_height_above_contact_m: 0.5307
  height_tolerance_m: 0.001

  # EL IMU NO.  Un acelerometro mide
  #     a_sensor = a_cm + alpha x r + omega x (omega x r)
  # con r desde el CENTRO DE MASAS, asi que igualarle la altura sobre el suelo
  # no iguala lo que mide: los tres tienen el CM a alturas muy distintas
  # (0.343 / 0.212 / 0.459 m sobre el suelo).  Y es r = 0, no un |r| comun:
  # alpha x r depende del VECTOR r, asi que dos brazos iguales en modulo y
  # distintos en direccion siguen midiendo cosas distintas.  El unico r comun
  # y canonico es cero.
  #
  # El punto exacto es el CM del robot SIN el IMU (solucion de p = c(p)).
  imu_at_centre_of_mass: true
  imu_lever_arm_tolerance_m: 0.002

  # Distancia del EJE de la rueda al suelo, por plataforma.  Es lo que fija el
  # plano de contacto, y no se puede dar por supuesto que sea el radio de la
  # rueda: MEDIDO dejando cada robot posarse en un suelo plano en z = 0 y
  # leyendo /gazebo/link_states.
  #
  # El tracked NO apoya en el sprocket sino en la BANDA.  Cadena de radios
  # desde el eje: sprocket/idler 0.128 = cara interna, trayectoria del plugin
  # (y radio del cilindro del arco) 0.138 = linea media, cara exterior 0.148 =
  # suelo.  Los elementos de la banda no existen hasta que el plugin corre,
  # asi que esto NO se puede leer del model.sdf; de ahi que se declare aqui.
  contact_plane_below_axle_m:
    differential: 0.148
    rocker_bogie: 0.148
    tracked: 0.148

# Tasa a la que cada controlador publica el estado de sus articulaciones.
# Aqui porque wheel_odometry.py saca de joint_states la velocidad longitudinal
# que alimenta el de-skew, y tiene que ser la misma en las tres.
sensor_rates:
  joint_states_hz: 50

# ORIENTACION DEL IMU: no la publica el plugin, la fusiona imu_ahrs.py.  El
# <imu> de SDF solo admite <noise> bajo <angular_velocity> y
# <linear_acceleration>; el campo orientation sale de la pose exacta del link
# y no hay forma de sembrarle ruido, asi que consumirlo seria darle verdad de
# terreno a la campana que mide el error de estimacion.  Roll y pitch salen de
# un filtro complementario giroscopo+acelerometro y la guiñada de integrar el
# giroscopo, que deriva - como debe, porque sin magnetometro un IMU no observa
# el rumbo absoluto.
imu_orientation:
  source: "complementary filter (imu_ahrs.py)"
  tau_s: 1.0
  accel_gate_fraction_of_g: 0.15
  gyro_bias_estimated_at_rest: true

# El LiDAR declara una sola gaussiana, la del <noise> sembrado: 0.008 en el
# sensor MAS 0.008 en el plugin serian dos independientes, o sea 0.011314 m
# efectivos.  Es ese numero el que hay que reportar, no 0.008.
sensor_noise:
  lidar_range_stddev_m: 0.011314
  imu_angular_velocity_stddev_rad_s: 0.009
  imu_linear_acceleration_stddev_m_s2: 0.021
  camera_stddev: 0.007

# -----------------------------------------------------------------------------
# PHYSICS - must be IDENTICAL for the three robots.
# These values are declared in the <physics> block of lcmine.world, which is
# byte-identical in the three robot packages.
# -----------------------------------------------------------------------------
# real_time_update_rate slows the WALL clock without touching the physics
# (max_step_size stays at 0.0005) so the LiDAR's gpu_ray keeps up.  Do not
# confuse it with metrics_logger physics_rate_hz, which is 1/max_step_size =
# 2000 Hz: ModelStates arrives once per physics step, i.e. every 0.5 ms of
# SIMULATION time, whatever the wall clock does.
#
# 100 solver iterations and not Gazebo's default 50: the Rocker-Bogie puts 6
# wheel contacts and 5 passive pivots into one constraint island, and an
# under-converged LCP shows up as contact jitter and spurious wheel lift-off on
# the step obstacle - a solver artefact easy to mistake for loss of contact.
# Measured on the tracked platform, headless, no SLAM: iters=150 gives RTF
# 0.41, iters=100 gives 0.69, iters=50 gives 0.65 (under-converged).
#
# PENDING: the "<2% change in peak vertical acceleration" convergence criterion
# has not been re-run at 100 iterations / 0.5 ms on the Rocker-Bogie, which is
# the platform that motivated the high count.  Do that before any
# step-crossing figure goes into the paper.
#
# contact_max_correcting_vel is 10 and not 100: at 100 m/s it limits nothing
# and an accumulated penetration is resolved as a shot - 1.533 m of
# displacement in 1 s against a max_vel_x of 0.5.
physics:
  engine: "ode"                     # Gazebo classic 11, ODE backend
  max_step_size_s: 0.0005            # s
  real_time_update_rate_hz: 1000    # Hz  -> target real_time_factor 0.5
  real_time_factor: 0.5
  solver:
    type: "quick"                   # iterative LCP (projected Gauss-Seidel)
    iters: 100
    sor: 1.3
    use_dynamic_moi_rescaling: true
  constraints:
    cfm: 0.0
    erp: 0.2
    contact_max_correcting_vel: 10.0
    contact_surface_layer_m: 0.001
  gravity_mps2: [0.0, 0.0, -9.81]

# -----------------------------------------------------------------------------
# TERRAIN - identical for the three robots.  Declared in the world / model SDFs.
# -----------------------------------------------------------------------------
terrain:
  lc_mine:      { mu1: 1.0, mu2: 1.0, note: "mine gallery mesh, drivable surface" }
  grass_plane:  { mu1: 1.0, mu2: 1.0, note: "ground plane outside the gallery" }
  ramp:         { mu1: 1.5, mu2: 1.5, note: "5 m long, 1.5 m high, 10 m wide" }
  step:         { mu1: 1.5, mu2: 1.5, note: "the step obstacle, see below" }

# -----------------------------------------------------------------------------
# ROBOT CONTACT - the friction the DRIVING surfaces of each platform declare.
# -----------------------------------------------------------------------------
# mu is the coefficient along fdir1 and mu2 the one across it, and ODE takes
# the MINIMUM of the two surfaces in contact.  A friction anisotropy is exactly
# the parameter that sets how hard a skid-steer platform has to work to yaw,
# which is the quantity this study is about, so it cannot be a per-platform
# accident.  THE TRACKED PLATFORM IS THE ANCHOR: its value is the one that was
# declared deliberately and isotropic.  Giving all three 100.0 longitudinally
# instead would have removed wheel slip from a study about locomotion.
#
# fdir1 is out of the three models: it lives in the COLLISION frame, and a
# wheel's collision turns with the wheel, so the "rolling direction" it names
# does not stay put (gazebo-classic#2068).
#
# mu1 was tried at 1.5 because the husky turned poorly, and returned to 1.0:
# with measured wheel torque and speed the husky uses 22-38 N longitudinally
# per wheel in a curve against the 110 N that mu1 1.0 already gives.  The yaw
# is lost in the velocity loop (x0.7) and in contact slip (x0.4), not in grip.
# The ramp and the step stay at 1.5.
#
# mu2 stays at 0.75 because raising it traps an articulated suspension: turning
# the bogie needs the wheels to slide sideways, and with more lateral grip they
# cannot - two of the rocker's six wheels left the ground 73% and 82% of the
# time at mu2 1.0.
#
# NOT COVERED HERE, and left alone deliberately: the non-driving collisions.
# The Rocker-Bogie declares mu1 0.2 / mu2 1.0 on its chassis and linkage links
# while the Husky's chassis and the tracked platform's body, sprockets and
# idlers declare no <surface> at all, i.e. ODE's default 1.0 / 1.0.  That is a
# real difference, but it only bites when a platform is dragging its belly, and
# equalising it would change the Rocker-Bogie's step-climbing behaviour - which
# is a measured result.  Decide it separately, with a step run behind it.
robot_contact:
  anchor: tracked
  mu1: 1.0
  mu2: 0.75
  note: "isotropico 1.0/1.0 en las tres; sin fdir1; ODE toma min() contra el terreno"

  # RIGIDEZ DE CONTACTO - comun a las tres, y la seccion 16 del parity check lo
  # vigila: sin ella el tracked corria con el defecto de Gazebo (kp = 1e12)
  # contra el 1e5 de los otros dos, siete ordenes de magnitud de diferencia
  # entre plataformas que se comparan entre si.
  #
  # kp = 1e6 es el compromiso medido.  1e7 (el valor de fabrica del Husky de
  # Clearpath, pensado para otro mundo) hacia girar al Husky 16.4 deg durante
  # el aterrizaje, y esos grados se quedaban como condicion inicial; a 1e6 el
  # giro de spawn es 1.09 / 0.70 / 0.56 deg en las tres.
  #
  # min_depth 0.003 y no 0.001: con 0.001 los puntos de contacto por rueda
  # pasan de 2.9-4.8 a 47-92 -muchos mas triangulos de la malla cuentan como
  # en contacto- y la suma de cargas de las seis ruedas del rocker llega a
  # 11814 N contra los 441 N que pesa.  Con ese reparto la plataforma vuelca.
  contact_stiffness:
    kp: 1000000.0
    kd: 1.0
    min_depth: 0.003
    max_vel: 1.0
  surfaces:
    differential:
      declared_in: "differential/model/differential/model.sdf"
      kind: sdf_collision
      links: [back_left_wheel, back_right_wheel,
              front_left_wheel, front_right_wheel]
    rocker_bogie:
      declared_in: "rocker_bogie/urdf/ensamblajeurdf.gazebo"
      kind: gazebo_reference
      links: [Rueda_1_1, Rueda_2_1, Rueda_3_1,
              Rueda_4_1, Rueda_5_1, Rueda_6_1]
    tracked:
      declared_in: "tracked/gazebo_continuous_track_example/model/two_track_robot/model.sdf"
      kind: sdf_collision
      links: [left_track_straight_segment_link0,
              left_track_straight_segment_link1,
              left_track_arc_segment_link0,
              left_track_arc_segment_link1,
              right_track_straight_segment_link0,
              right_track_straight_segment_link1,
              right_track_arc_segment_link0,
              right_track_arc_segment_link1]

# The step-crossing obstacle, shared by the three platforms.
#
# WARNING: size_m[2] and height_m are the slab THICKNESS, not the effective
# step the robot climbs - the slab sits 5 cm into the gallery floor.
# check_sim_parity.py only checks the thickness, so it will not catch the
# difference.  Measure the real protrusion before either number goes into the
# paper.
step_obstacle:
  model_name: "bump"
  pose_xyzrpy: [54.0, -27.8, 5.30, 0.0, 0.0, 1.57]
  size_m: [3.5, 10.0, 0.1]      # [along travel, across gallery, HEIGHT]
  height_m: 0.1

# -----------------------------------------------------------------------------
# MASS MATCHING - the three platforms must weigh the same.
# -----------------------------------------------------------------------------
# scale_masses.py scales every link mass and inertia so the platforms share a
# total.  check_sim_parity.py WEIGHS the model each launch file actually spawns
# and compares it with this, rather than looking for the banner scale_masses.py
# writes: that banner is an XML comment, so it sits in whichever file the author
# put it in and xacro strips comments on expansion.  Weighing the spawned model
# is the only check that cannot be satisfied by editing the wrong file.
mass_matching:
  target_kg: 45.0
  tolerance_kg: 0.05

# -----------------------------------------------------------------------------
# ACTUATION - must give the three platforms the same drive authority.
# -----------------------------------------------------------------------------
# "At equal motor torque the light platform accelerates harder" is a confound,
# which is why scale_masses.py exists; it only holds if the torque really is
# equal, so the drive authority is a declared, single-valued test condition and
# check_sim_parity.py asserts the models agree with it.
#
# The shared quantity is the TRACTIVE FORCE at the contact patch, not the
# per-joint torque: the platforms drive 4, 2 and 6 joints respectively, so
# equal per-joint torque would not be equal drive authority.
#
#     tau_joint = F_budget * wheel_radius / n_driven_joints
#
actuation:
  # The Rocker-Bogie is the ANCHOR: 20 N*m per wheel is the figure chosen by
  # hand and the budget follows as F = tau * n / r.  The three platforms keep
  # the torques a real motor gives (20 / 30 / 60 N*m for 6 / 4 / 2 wheels),
  # which at r = 0.148 is the same budget for all three:
  # 20*6/0.148 = 30*4/0.148 = 60*2/0.148 = 810.811 N.
  traction_force_budget_N: 810.811

  # Why this is the right order of magnitude.  The friction ceiling for a 45 kg
  # platform on the highest-mu surface in the world (ramp and step, mu = 1.5)
  # is 1.5 * 45 * 9.81 = 662 N.  The budget is 1.02x that, so every platform is
  # TRACTION-limited and none is MOTOR-limited, which is the regime the study
  # was designed around: what is compared is the locomotion geometry, not the
  # motor sizing.  Note how thin 1.02x is - treat this number as a REGIME
  # BOUNDARY, not merely as a magnitude.  For reference the 5 m / 1.5 m ramp
  # (16.7 deg) needs only m*g*sin(theta) = 127 N, a 5.3x margin.
  friction_force_ceiling_N: 662.2      # 1.5 * 45.0 * 9.81, for the margin above
  ramp_force_demand_N: 126.7           # 45.0 * 9.81 * sin(atan(1.5/5))

  # Per-platform ceilings derived from the budget.  n_driven and wheel_radius
  # are properties of the model, tau_max_N_m is what must appear in the file
  # Gazebo loads.  declared_in names that file and the tag carrying the value.
  platforms:
    differential:
      n_driven: 4
      wheel_radius_m: 0.148
      tau_max_N_m: 30.000               # 810.811 * 0.148 / 4
      declared_in: "differential/urdf_xacro/husky.urdf.xacro"
      declared_tag: "limit effort"    # read from robot_description by gazebo_ros_control
    tracked:
      n_driven: 2
      wheel_radius_m: 0.138           # sprocket pitch_diameter 0.276 / 2
      tau_max_N_m: 55.946            # 810.811 * 0.138 / 2
      declared_in: "tracked/gazebo_continuous_track_example/urdf_xacro/two_track_robot.urdf.xacro"
      declared_tag: "limit effort"    # read from robot_description by gazebo_ros_control
    rocker_bogie:
      n_driven: 6
      wheel_radius_m: 0.148
      tau_max_N_m: 20.000             # 810.811 * 0.148 / 6
      declared_in: "rocker_bogie/urdf/ensamblajeurdf.xacro"
      declared_tag: "limit effort"

  # ---------------------------------------------------------------------------
  # Parasitic drag in the drive joints.  This is NOT the contact friction that
  # the terrain section governs; it is the <dynamics> viscous and Coulomb term
  # on the joint itself, which subtracts directly from the torque that reaches
  # the ground.  Zero for all three: resistance to motion must come from the
  # shared contact model and not from a per-platform joint term - the
  # Rocker-Bogie used to pay 7.4 N*m = 41.6 N of drag the other two did not, a
  # third of what the ramp itself costs.
  #
  # Applies to the DRIVE joints only.  The Rocker-Bogie's passive suspension
  # pivots (rocker_pivot_left/right, rev_3, rev_4) and steering joints
  # (rev_5..rev_8) keep their damping: those model the suspension and the
  # steering actuator, and they have no counterpart to match on the other two.
  drive_joint_damping_N_m_s: 0.0
  drive_joint_friction_N_m: 0.0

  # Kinematic ceiling on the drive joints, so the models share one.
  # 5.0 rad/s * 0.148 m = 0.74 m/s, comfortably above the 0.4 m/s commanded.
  max_joint_rate_rad_s: 5.0

  # ---------------------------------------------------------------------------
  # Velocity-loop stiffness.
  # ---------------------------------------------------------------------------
  # Equal torque ceilings are not enough: a loop with a lower gain delivers less
  # torque for the same speed error, which reads as "cannot climb" even with
  # headroom to spare.  The comparable quantity is the loop stiffness referred
  # to the contact patch - newtons of tractive force per m/s of speed droop:
  #
  #     K_F = n_driven * p / wheel_radius^2        [N / (m/s)]
  #     K_I = n_driven * i / wheel_radius^2        [N / (m/s) / s]
  #
  # ALL THREE platforms run the same loop: gazebo_ros_control with
  # velocity_controllers/JointVelocityController on every driven joint.  A
  # skid-steer drive plugin would not be comparable - it sets an ODE joint
  # motor velocity and an fmax, i.e. a rigid velocity source with zero droop.
  #
  # The Rocker-Bogie is the anchor: its gains carry a derivation (rescaled by
  # mass_scale so that wn and zeta survive the mass matching - see the comment
  # in lcmine_rocker_bogie_world.launch).  The other two are solved from it,
  #
  #     p_x = K_F * r_x^2 / n_x          i_x = K_I * r_x^2 / n_x
  #
  # K_F CANNOT RISE WITHOUT LOWERING dt: gazebo_ros_control integrates the PID
  # explicitly in the physics step, so the loop is stable only while
  # p < 2*I/dt.  The binding joint is the tracked sprocket (iyy = 0.0152, the
  # lightest driven element and shared between only 2 joints): at dt = 0.0005
  # its limit is 60.8 and the current 44.37 sits at 73% of it.  Crossing it
  # once made the tracked platform drive itself under zero command, which is
  # where dt = 0.0005 came from.  The integral has no such restriction.
  velocity_loop:
    K_F_N_per_m_s: 2800.78            # 6 * 14.790 / 0.178^2
    K_I_N_per_m_s_per_s: 2692.80      # 6 * 14.220 / 0.178^2
    gains:
      rocker_bogie: { p: 10.225, i: 9.831, d: 0.0, i_clamp: 20.000 }
      tracked:      { p: 26.669, i: 25.641, d: 0.0, i_clamp: 55.946 }
      differential: { p: 15.337, i: 14.746, d: 0.0, i_clamp: 30.000 }

  # i_clamp is not cosmetic.  control_toolbox reads i_clamp_min/i_clamp_max from
  # the parameter server and DEFAULTS THEM TO 0.0, so a pid_gains block that
  # declares i > 0 and no i_clamp has its integral term clamped to zero on every
  # step: the loop is P-only and the steady-state droop on a sustained grade is
  # never corrected.  The clamp is set to the platform's own per-joint torque
  # ceiling, so integral action can use the full authority the budget allows
  # and no more.
  i_clamp_policy: "i_clamp = tau_max_N_m of that platform"

  # ---------------------------------------------------------------------------
  # COMMAND PATH - what each twist_to_* node is allowed to do to cmd_vel before
  # it reaches the wheels.  These nodes sit between move_base and the
  # controllers, so a fudge factor here is just as much a per-platform advantage
  # as a gain would be.  min_angular forces |w| up to a floor whenever a
  # non-zero yaw rate is commanded, which flatters exactly the turn-in-place
  # behaviour RPE is sensitive to: zero everywhere.
  command:
    min_angular_rad_s: 0.0
    # No command-side acceleration limiting either: acceleration is bounded by
    # the torque budget and the planner limits below, both of them shared.
    wheel_acceleration_limit: null

  # ---------------------------------------------------------------------------
  # SEGUIDOR DE TRAYECTORIA FIJA - las ganancias del control law compartido.
  #
  # trajectory_follow.launch es UNO SOLO y run_campaign.sh lo invoca igual para
  # las tres, cambiando nada mas el modelo, el topico de cmd_vel y el yaw de
  # spawn, asi que estas ganancias son comunes por construccion.
  #
  # Importa mas de lo que parece: la MISMA ganancia no da el mismo lazo cerrado
  # en las tres, porque entregan guiñadas muy distintas (alfa 0.202 / 0.311 /
  # 0.805 en el banco frio).  Cualquier retoque hay que evaluarlo en las tres,
  # no solo en la que moleste.
  #
  # Lo que ordena el error lateral es el LOOKAHEAD, no k_xte: barrer k_xte de
  # 0.0 a 1.0 cambia la sobreoscilacion menos del 15 %, mientras que acortar el
  # lookahead de 0.60+1.6v a 0.30+0.8v baja el error lateral medio de
  # 0.103/0.025/0.054 a 0.041/0.012/0.017 m (differential/tracked/rocker).
  # Mejora las tres con el MISMO valor, asi que no rompe la paridad.  Se para
  # en 0.30 porque por debajo de 0.25 la oscilacion despega y el banco no tiene
  # terreno irregular.
  trajectory_follower:
    k_xte: 2.5                  # curvatura por metro de error lateral, 1/m^2
    xte_curv_max: 0.5           # tope de esa correccion, 1/m
    lookahead_min_m: 0.30
    lookahead_max_m: 1.0
    lookahead_k_s: 0.8          # L = min + k*v
    align_threshold_rad: 0.8    # rumbo vs TRAMO de ruta; por encima, arco de alineacion
    curve_slowdown: 0.6         # v = v_max / (1 + k*|curv|)
    w_v_floor_m_s: 0.10
    min_aim_dist_m: 0.25        # por debajo, el vector al objetivo es ruido

  # ---------------------------------------------------------------------------
  # PLANNER LIMITS - the accelerations DWA believes it may command.
  # ---------------------------------------------------------------------------
  # These belong here rather than with the rest of move_base because they are
  # the demand side of the same quantity the torque budget supplies.  A planner
  # that believes it can accelerate at 12 m/s^2 plans trajectories the plant
  # cannot execute and then reports the shortfall as tracking error.
  #
  # acc_lim is not only a statement about the plant.  In dwa_local_planner the
  # velocity window sampled each cycle is acc_lim * sim_period, with
  # sim_period = 1 / controller_frequency = 0.1 s on all three, so a value
  # taken purely from the plant's honest acceleration (1.0 m/s^2) leaves DWA
  # 0.1 m/s of speed range per cycle.  The shared value is therefore sized by
  # the sampler and then checked against the plant - it must span the commanded
  # range in one control period:
  #     acc_lim_x     >= max_vel_trans / sim_period = 0.5 / 0.1 =  5.0 m/s^2
  #     acc_lim_theta >= max_vel_theta / sim_period = 1.0 / 0.1 = 10.0 rad/s^2
  # 45 kg * 5.0 = 225 N, against the traction budget and a 441 N friction
  # ceiling on the mu = 1.0 gallery floor, so the plant can honour it.
  planner:
    acc_lim_x: 5.0
    acc_lim_y: 0.0
    acc_lim_theta: 10.0

    # How much wider than itself each platform believes it is - a direct
    # multiplier on clearance in exactly the confined drift this study is
    # about, so it is shared.  The widest platform (Rocker-Bogie, 0.96 m
    # footprint) needs 1.16 m against the 1.35 m corridor measured at the
    # tightest point.
    #
    # If a platform still cannot take a gallery curve, raise this for ALL THREE
    # together, never for the one that is struggling.  Note that at 0.10 it is
    # BELOW the Rocker-Bogie's 0.321 m inscribed radius, so InflationLayer
    # writes INSCRIBED at every inflated cell and there is no decaying cost
    # gradient for occdist_scale to act on: DWA gets no pressure to stay away
    # from walls, only a hard rejection when it is already touching one.
    inflation_radius: 0.10

    # A rocker-bogie turns on the spot - the four corner wheels steer tangent
    # to a circle about the vehicle centre while the middle pair, already on
    # that centre line, stay straight, and twist_to_wheels.py has always
    # carried spin_turn() for it.  What forbade the manoeuvre was the STEERING
    # LOCK: the tangent angles this geometry needs are front +-60.07 deg and
    # rear -+51.55 deg, i.e. 1.0484 rad, against a +-0.5 rad limit.  The lock
    # is 1.1 rad now, min_turn_radius is 0.0 and can_pivot_in_place is true.
    #
    # STILL TO CHECK: that the CAD steering linkage clears itself at 1.1 rad.
    min_vel_trans_note: "0.0 / -0.15 on all three. The Rocker-Bogie's 0.1 floor
                         was a consequence of a 0.5 rad steering lock, not of
                         its kinematics; the lock is 1.1 rad now and it pivots
                         like the others."

    # ------------------------------------------------------------------------
    # DWA STALLS - what was measured and what was ruled out.
    # ------------------------------------------------------------------------
    # Symptom: the platform advances in stop-go, "DWA planner failed to produce
    # path" for 30-45 s, move_base aborts the waypoint.  cost -6 is
    # ObstacleCostFunction's return when the footprint OUTLINE is on a LETHAL
    # or INSCRIBED cell, and "Stopping cmd in collision" means that is true of
    # the pose the robot is already in, so v = 0 is rejected too.
    #
    # RULED OUT by measurement, not argument:
    #   - NOT actuation.  Six wheels in ground contact 97-100% of samples, peak
    #     speed reached, peak wheel torque 0.9-3.2 N*m of 46.7 available.
    #   - NOT rollover (peak tilt 24.3 deg) and not tilt corrupting the ground
    #     normals: corr(tilt, zero command) = -0.37, it stalls MORE at low tilt.
    #   - NOT SLAM: zero tracking losses, zero relocalizations.
    #   - NOT the DWA sampling window: acc_lim 1.0/1.5 -> 5.0/10.0 changed
    #     nothing.
    #   - NOT corridor width alone: measured continuously it ranges 1.15-3.30 m
    #     and the robot stalls in stretches over 2 m wide too.
    #
    # CAUSE, in stall_cause below: the floor itself was being published as
    # obstacle.  Grid/ClusterRadius 0.1 m is smaller than the 0.669 m gap
    # between consecutive LiDAR ground rings, so the floor could not form one
    # cluster and leaked into the costmap as speckle.
    planner_stall_note: "DWA rejects every trajectory because the footprint sits
                         on a costmap obstacle; whether that obstacle is the
                         gallery or a segmentation artefact is STILL OPEN"
    stall_cause: "the floor was published as obstacle (Grid/ClusterRadius 0.1 m
                  < the 0.669 m LiDAR ground-ring gap), so the footprint sat on
                  speckle and DWA rejected every trajectory. Corridor is really
                  2.30 m, not 1.35 m. Fixed by ClusterRadius 0.8 on all three."

    # ------------------------------------------------------------------------
    # WHEEL LOAD - there is no side-to-side asymmetry, and the figure that
    # reads these sensors is only valid by MAGNITUDE.
    # ------------------------------------------------------------------------
    # libgazebo_ros_bumper does NOT report in the world frame despite frameName
    # being world: the wheel link frames come out of CAD with different
    # orientations per side, and on the right-hand wheels the load lands in Fx,
    # not Fz.  Read by |F| the split is 1.26:1 and the total is 451 N against a
    # 441.5 N weight - a 2% match.  Do NOT "fix" anything to force.z.
    #
    # What IS real: the floor at the spawn point is banked 5.4 deg (contact
    # heights differ 64-67 mm across the 0.677 m track), which is what the
    # 4.7-5.0 deg roll bias in every attitude measurement comes from.
    wheel_load_asymmetry_note: "NO asymmetry - it was force.z read from a frame
                               that is not world. By magnitude the split is
                               1.26:1 and the total is 451 N against a 441.5 N
                               weight. The 5.4 deg floor bank is real. The
                               figure's force panel was 10x too high; fixed."

    # ------------------------------------------------------------------------
    # ROCKER PIVOTS - they are DRIVEN to whatever stop exists, not short of
    # travel: widening +-0.6 to +-1.0 rad moved the resting angle from 34 to 56
    # deg and the pitch from -27 to -55 deg.  Damping does not help, because a
    # joint against a stop has no error_dot to act on.
    #
    # With the geometric differential linkage in place the pivots use at most
    # ~7 deg and spend 0.00% of the time on the stop, so the rockers are at
    # +-1.0 rad.  The BOGIES were not widened: at 1.0 they wind up and the
    # vehicle rolls over (see the top of ensamblajeurdf.xacro).
    rocker_pivot_zero_note: "pivots are DRIVEN to whatever stop exists, not
                             short of travel: widening +-0.6 to +-1.0 rad moved
                             the resting angle from 34 to 56 deg and the pitch
                             from -27 to -55 deg. Reverted. Cause not yet
                             found; run the differential ablation WHILE DRIVING.
                             The pre-revision roll/pitch tables were measured in
                             this state."

# -----------------------------------------------------------------------------
# SPAWN POSE - x, y and physical heading identical for the three robots.
# z is the per-platform drop height (chassis above the floor), not a test
# condition; the settled chassis height at (33.5, 0.2) is about 1.06 m, so a
# spawn much below that puts the vehicle inside the terrain.
#
# base_yaw_offset_rad is what must be added to the MODEL yaw to get the
# PHYSICAL heading, and therefore where the `map` frame is born.  It is 0 in
# the three: the rocker's base_link faces +x like the others.  It is consumed
# by generate_waypoints.py and trajectory_follower.py (via the ~base_yaw_offset
# parameter that run_campaign.sh sets, which keeps its own copy because bash
# cannot read YAML: if you change one, change the other).
# -----------------------------------------------------------------------------
spawn:
  common: { x: 33.5, y: 0.2 }
  rocker_bogie:  { z: 1.2148, yaw_rad: 0.0,    base_yaw_offset_rad: 0.0,
                   model_name: "rocker_bogie" }
  differential:  { z: 1.18, yaw_rad: 0.0,    base_yaw_offset_rad: 0.0,
                   model_name: "differential" }
  tracked:       { z: 0.91, yaw_rad: 0.0,    base_yaw_offset_rad: 0.0,
                   model_name: "two_track_robot" }

# -----------------------------------------------------------------------------
# GROUND TRUTH - how the reference trajectory is obtained.
# -----------------------------------------------------------------------------
# This section answers the reviewer's question directly: the ground truth is the
# EXACT pose of the model as integrated by the physics engine.  It is not
# filtered, not smoothed, and carries no synthetic noise.
#
# ModelStates carries the canonical link pose (base_link, NOT the centre of
# mass and NOT the sensor frames) in the Gazebo world frame, taken straight
# from the ODE state vector at the end of the step.  The SLAM estimate is
# expressed in the same base_link frame, so no extrinsic compensation is
# applied when computing ATE/RPE; sensor offsets are in sensor_poses.csv.
#
# ModelStates carries NO header stamp, so metrics_logger.py timestamps every
# sample with the sim clock at reception.  Publication is ~1 kHz against a
# 50 Hz log rate, so the error is bounded by one physics step - three orders of
# magnitude below the ATE values of interest.
ground_truth:
  source_topic: "/gazebo/model_states"
  message_type: "gazebo_msgs/ModelStates"
  filtering: "none"
  added_noise: "none"
  logged_as: "gt_traj_<robot>_run<N>.tum   (TUM format: t tx ty tz qx qy qz qw)"
  sim_time: true
  log_rate_hz: 50

# -----------------------------------------------------------------------------
# SLAM
# -----------------------------------------------------------------------------
slam:
  backend: "rtabmap"
  odom_topic: "/rtabmap/odom"
  info_topic: "/rtabmap/info"
  odom_info_topic: "/rtabmap/odom_info"
  cloud_map_topic: "/rtabmap/cloud_map"
  # A tracking loss is recorded when RTAB-Map odometry reports a null/rejected
  # transform (odom_info.lost) or when no odometry message arrives for longer
  # than tracking_loss_timeout_s.
  tracking_loss_timeout_s: 1.0

# -----------------------------------------------------------------------------
# PER-ROBOT TOPIC / NAMING MAP
# -----------------------------------------------------------------------------
robots:
  rocker_bogie:
    display_name: "Rocker-bogie"
    cmd_vel_topic: "/cmd_vel"
    model_name: "rocker_bogie"
    base_frame: "rocker_bogie/base_link"
    wheel_links: ["Rueda_1_1", "Rueda_2_1", "Rueda_3_1",
                  "Rueda_4_1", "Rueda_5_1", "Rueda_6_1"]
    # Mapping from mesh link name to physical position, needed to plot the
    # contact figure with meaningful labels:
    wheel_layout:
      Rueda_5_1: "front_left"
      Rueda_3_1: "middle_left"
      Rueda_1_1: "rear_left"
      Rueda_2_1: "front_right"
      Rueda_4_1: "middle_right"
      Rueda_6_1: "rear_right"
  differential:
    display_name: "Husky (differential)"
    cmd_vel_topic: "/cmd_vel"
    model_name: "differential"
    base_frame: "husky/base_link"
  tracked:
    display_name: "Tracked"
    cmd_vel_topic: "/cmd_vel"
    model_name: "two_track_robot"
    base_frame: "example_two_track/base_link"

# Canonical column order for every generated table.
robot_order: ["differential", "tracked", "rocker_bogie"]
