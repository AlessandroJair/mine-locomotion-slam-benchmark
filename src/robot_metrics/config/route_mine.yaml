# =============================================================================
# route_mine.yaml - the exploration route, defined ONCE in world coordinates
# =============================================================================
# The route lives here, in GAZEBO WORLD COORDINATES, and generate_waypoints.py
# projects it into each robot's own map frame using that robot's spawn pose
# from sim_config.yaml.  Every platform therefore drives the same physical path
# through the same gallery, and the per-robot waypoint YAMLs are generated
# artefacts that must never be edited by hand - one hand-edited file puts one
# platform on a different route and invalidates the comparison.
#
# -----------------------------------------------------------------------------
# HOW THE POINTS WERE CHOSEN
# -----------------------------------------------------------------------------
# The corridors are NOT invented.  The mine is a 3D mesh (lc_mine/untitled2.dae)
# whose drivable galleries cannot be read off the .world file, so the route
# follows the four corridors a Husky run demonstrably drove:
#
#     north gallery   y ~   0.2, x from 18 to 52
#     east  gallery   x ~  54.0, y from 0 to -33
#     south gallery   y ~ -38.8, x from 47 down to 20
#     west  gallery   x ~  19.0, y from -34 up to 0
#
# with the points DISTRIBUTED along them:
#
#   1. Even spacing, every 8-11 m along the whole loop, instead of gaps of
#      1.0 m next to gaps of 11.2 m.
#   2. Coverage.  Every corridor carries intermediate points, so the robot is
#      driven along its full length rather than corner to corner.
#   3. The step is straddled, not landed on.  Waypoints sit 4 m before and 4 m
#      after the slab, never on it.  A waypoint on the obstacle makes the robot
#      stop and re-orient with one axle raised, which measures the follower's
#      tuning instead of the platform's ability to cross; straddling leaves the
#      crossing as one uninterrupted segment plot_wheel_contact.py can isolate.
#   4. Loop closure.  The route returns to its origin along the same corridor
#      it left by, so RTAB-Map gets a genuine revisit to detect.
#
# Obstacles, from sim_config.yaml:
#   step  on the east gallery, which is why the route runs down x = 54.
#
#   ramp  centred (25.5, -9.5), 5 m long, 1.5 m high, 16.7 deg slope.  This is
#         NOT a test obstacle: it and the other added blocks are terrain
#         patching, placed to cover holes in the lc_mine mesh.  It sits inside
#         the loop rather than on any of the four corridors, so no robot drives
#         over it.  That is intended - but it does mean the paper cannot make
#         any claim about slope or ramp climbing on the strength of these runs.
#         Doing so would need its own route and its own validated corridor; do
#         not simply add a waypoint at (25.5, -9.5) and assume the robot can
#         get there.
#
# Spawn pose (identical for all three): x = 33.5, y = 0.2
# Travel direction: east, south, west, north.
# =============================================================================

route:
  name: "mine_loop_2026"
  frame: "gazebo_world"

  # ---------------------------------------------------------------------------
  # DENSIFICATION
  # ---------------------------------------------------------------------------
  # The corner points below are the ROUTE.  max_spacing_m does not change the
  # path, it only subdivides it: generate_waypoints.py inserts interpolated
  # goals along the straight line between consecutive points until no gap
  # exceeds this, and does it in world coordinates BEFORE projecting into each
  # robot's frame, so the three platforms receive identical points.
  #
  # Why: at 8-11 m spacing, a goal move_base cannot reach costs the whole
  # segment - it exhausts its recovery behaviours, aborts, and the navigator
  # skips to a point up to 11 m further on.  Shorter hops mean a shorter global
  # plan per goal, more goals actually reached, and a smaller loss when one is
  # abandoned.
  #
  # Set to null to recover the original 17-point route.
  max_spacing_m: 4.0

  # Interpolated points that would land inside one of these are dropped.  The
  # step obstacle is crossed BETWEEN two waypoints on purpose (see the note
  # above); an interpolated goal sitting on the slab would undo that.  y_min
  # follows the slab: 1 m of margin below its south edge.
  no_waypoint_zones:
    - {name: "step_obstacle", x_min: 51.0, x_max: 57.0,
       y_min: -30.55, y_max: -25.05}

  # yaw is the heading in world coordinates, degrees, CCW from +x.
  waypoints:
    - {name: "start",            x:  33.5, y:   0.2, yaw:    0.0}

    # --- north gallery, heading east ---
    - {name: "north_mid",        x:  43.0, y:   0.2, yaw:    0.0}
    - {name: "ne_corner",        x:  52.5, y:   0.2, yaw:  300.0}

    # --- east gallery, heading south, toward the step ---
    - {name: "east_north",       x:  54.0, y:  -8.0, yaw:  270.0}
    - {name: "east_mid",         x:  54.0, y: -17.0, yaw:  270.0}
    - {name: "step_run_up",      x:  54.0, y: -23.0, yaw:  270.0}

    # --- the step (y from -26.05 to -29.55) is crossed between these two ---
    # The crossing is taken at an ANGLE, not square-on, so the wheels engage
    # one at a time instead of both sides at once: square-on the Rocker-Bogie
    # stopped dead on the step -11 s commanded at 0.5 m/s with a ground speed
    # of 0.02-0.05 and 4 of 6 wheels in contact- then levered up to 27 deg of
    # pitch and was thrown over when a suspension joint let go of its stop
    # (1150 deg/s, 13.3 m/s: a solver artefact, not locomotion).
    - {name: "step_exit",        x:  55.5, y: -31.0, yaw:  270.0}

    # The descent off the step, explicit rather than interpolated because both
    # wheeled platforms rolled over on this stretch when the point sat further
    # west: the Rocker-Bogie at (53.42, -31.93) climbing 0.48 m of terrain, and
    # the differential at (53.17, -31.51) rearing from -8 to -43.5 deg over 9 s
    # with its ground speed at 0.01-0.09 m/s against 0.5 commanded.  This value
    # is the best measured: no rollover, 0 aborts, 0 failed waypoints, max tilt
    # 26.1 deg, all six wheels down 88.3% of the run.  densify() does not move
    # the points it inserts, so a goal can only be moved by making it a route
    # waypoint like this one.
    - {name: "step_descent",     x:  55.0, y: -34.0, yaw:  240.0}

    - {name: "se_corner",        x:  51.5, y: -37.0, yaw:  210.0}

    # Explicit for the same reason as step_descent: interpolated, this goal
    # landed 0.6 m north of the south gallery's axis (y ~ -38.8) and the
    # Rocker-Bogie oscillated against it until move_base aborted the run.
    # Placed 0.4 m below the axis so the leg out of the corner runs down the
    # middle of the gallery rather than grazing its north wall; yaw 190 is the
    # value the interpolation gave it, kept so the heading profile through the
    # corner is unchanged.
    - {name: "se_gallery_in",    x:  44.5, y: -39.2, yaw:  190.0}

    # --- south gallery, heading west ---
    - {name: "south_east",       x:  41.0, y: -38.8, yaw:  180.0}
    - {name: "south_mid",        x:  31.0, y: -39.5, yaw:  180.0}
    - {name: "south_west",       x:  22.0, y: -38.5, yaw:  170.0}

    # Explicit, and 1 m south of where the densifier put it, together with
    # sw_corner below.  yaw 130 is the interpolated value, kept so the heading
    # ramp through the corner is unchanged.
    - {name: "sw_approach",      x: 20.75, y: -36.75, yaw:  130.0}

    # --- west gallery, heading north ---
    - {name: "sw_corner",        x:  19.5, y: -34.0, yaw:   90.0}
    - {name: "west_south",       x:  19.0, y: -24.0, yaw:   90.0}
    - {name: "west_mid",         x:  18.5, y: -14.0, yaw:   90.0}
    - {name: "nw_corner",        x:  19.0, y:  -3.0, yaw:   60.0}

    # --- back east along the north gallery to close the loop ---
    - {name: "north_west",       x:  25.5, y:   0.2, yaw:    0.0}
    - {name: "loop_close",       x:  33.5, y:   0.2, yaw:    0.0}

# -----------------------------------------------------------------------------
# FOLLOWER TUNING
# -----------------------------------------------------------------------------
# These become the navigation_params block of every generated file, so the
# three platforms are driven with identical gains and tolerances.
navigation_params:
  # Arrival tolerance. 0.8 m is a little over one vehicle length for these
  # platforms; tighter than that and a steered vehicle that cannot pivot on
  # the spot oscillates around the point instead of moving on.
  goal_tolerance: 0.8            # m
  angular_tolerance: 0.15        # rad (~8.6 deg)

  # NOTE: max_linear_speed is NOT what limits the speed of a run.  The follower
  # commands with ~max_vel_x, which comes from the launch file; verify the
  # speed a run actually used in its navigation.log, not here.
  max_linear_speed: 0.4          # m/s - identical for all three platforms
  max_angular_speed: 0.8         # rad/s

  # Proportional gains of the fallback pure-pursuit-style follower.
  linear_kp: 0.6
  angular_kp: 1.2

  # Slow down this far out so the robot arrives at a speed it can stop from
  # instead of overshooting and re-approaching.
  approach_distance: 2.0         # m
  approach_speed: 0.2            # m/s

  use_move_base: true
  move_base_timeout: 180.0       # s
  move_base_retry_count: 2

# -----------------------------------------------------------------------------
# PER-PLATFORM KINEMATIC LIMITS
# -----------------------------------------------------------------------------
# The three pivot in place, so the minimum radius is 0 for all of them.  The
# Rocker-Bogie's corner wheels reach the tangent angles a point turn needs now
# that the steering lock is 1.1 rad rather than 0.5 - it was the lock, not the
# mechanism, that forbade the manoeuvre.
platform_limits:
  rocker_bogie:
    min_turn_radius: 0.0         # m
    can_pivot_in_place: true
  differential:
    min_turn_radius: 0.0         # m
    can_pivot_in_place: true
  tracked:
    min_turn_radius: 0.0         # m
    can_pivot_in_place: true
