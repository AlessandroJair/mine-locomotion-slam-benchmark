# =============================================================================
# RTAB-MAP SLAM parameters - Differential (Husky)
# =============================================================================

# IMU
Imu/Enable: "true"

# Detection and memory
Rtabmap/DetectionRate: "1.0"
Rtabmap/TimeThr: "0"
Mem/IncrementalMemory: "true"
Mem/InitWMWithAllNodes: "false"

# 3D Mapping / Occupancy Grid
Grid/3D: "true"
Grid/FromDepth: "false"
Grid/RayTracing: "true"
Grid/CellSize: "0.05"
Grid/ClusterRadius: "1"
Grid/GroundIsObstacle: "false"
Grid/MaxObstacleHeight: "2.0"
Grid/MaxGroundHeight: "0.15"
Grid/NormalK: "20"
Grid/NormalsSegmentation: "false"
Grid/RangeMax: "50.0"
Grid/RangeMin: "1.0"
GridGlobal/MinSize: "20"
GridGlobal/Eroded: "false"

# ICP for loop closure
Reg/Strategy: "1"
Icp/VoxelSize: "0.1"
Icp/PointToPlaneK: "20"
Icp/PointToPlane: "true"
Icp/Iterations: "30"
Icp/Epsilon: "0.001"
Icp/MaxTranslation: "3"
Icp/MaxCorrespondenceDistance: "1.0"
Icp/PM: "true"
Icp/PMOutlierRatio: "0.7"

# Visual features
Kp/MaxFeatures: "400"
Kp/DetectorStrategy: "6"
GFTT/MinDistance: "10"

# Loop closure
Mem/NotLinkedNodesKept: "false"
Mem/STMSize: "30"
Rtabmap/LoopRatio: "0.7"

# Proximity and loop closure detection
RGBD/ProximityMaxGraphDepth: "50"
RGBD/ProximityPathMaxNeighbors: "10"
RGBD/AngularUpdate: "0.015"
RGBD/LinearUpdate: "0.01"
RGBD/CreateOccupancyGrid: "true"
Optimizer/Strategy: "1"
