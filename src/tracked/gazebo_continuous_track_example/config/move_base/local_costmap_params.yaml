# Local costmap - rolling window alrededor del robot
local_costmap:
  global_frame: odom
  robot_base_frame: example_two_track/body
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 3.0
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05

  # ObstacleLayer, not VoxelLayer.  This was an UN-EQUALISED PLATFORM
  # DIFFERENCE: the differential already used ObstacleLayer while the tracked
  # and the Rocker-Bogie used VoxelLayer, so one platform cleared its costmap in
  # 2D and the other two in 3D.  check_sim_parity.py does not inspect the plugin
  # list, so it was never caught.
  #
  # The 3D layer bought nothing here - obstacles_detection already segments the
  # ground away upstream, which is why min/max_obstacle_height are -+99999 - and
  # it cost two failure modes: it cannot clear the sensor's near-field blind
  # annulus (rays to distant endpoints pass above the near floor voxels), and
  # its voxel column is anchored at origin_z 0.0 in ODOM, 2.0 m tall, while the
  # route climbs.  Measured on the Rocker-Bogie 2026-08-20: 100% of the lethal
  # cells within 1.5 m of the robot had no live sensor support.
  # See rocker_bogie/config/move_base/local_costmap_params.yaml for the full
  # derivation.  Keep this EQUAL ON ALL THREE PLATFORMS.
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    # Nube ya segmentada; filtro de altura desactivado a proposito.
    observation_sources: obstacle_cloud
    obstacle_cloud:
      sensor_frame: example_two_track/velodyne_base_link
      data_type: PointCloud2
      topic: /example_two_track/obstacles_cloud
      marking: true
      clearing: true
      min_obstacle_height: -99999.0
      max_obstacle_height:  99999.0
      obstacle_range: 5.0
      raytrace_range: 6.0

  inflation_layer:
    # EQUAL ACROSS THE THREE ROBOTS, from planner.inflation_radius in
    # robot_metrics/config/sim_config.yaml.  This was 0.25 on the Rocker-Bogie
    # and 0.40 on the other two - never equalised, never checked.  It is a
    # direct multiplier on how wide each platform believes it is, so an
    # unequal value hands one platform more clearance than another in exactly
    # the confined drift the study is about.
    # 0.10 m: the widest platform (Rocker-Bogie, 0.96 m footprint) then needs
    # 0.96 + 0.20 = 1.16 m, against the 1.35 m corridor measured at the point
    # where it used to stall.
    inflation_radius: 0.10
    cost_scaling_factor: 10.0
